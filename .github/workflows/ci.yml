name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint / Scalafmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt scalafmtCheckAll

  test:
    name: Tests / ChiselTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        env:
          RV32I_HEX: src/test/resources/diagnostics/rv32i-add.hex
        run: sbt test

      - name: Elaborate Pipeline5 Verilog
        run: sbt "runMain riscv.core.pipeline.pipeline5.Pipeline5Main --target-dir target/ci-verilog"

  required:
    name: CI Required
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: exit 1
